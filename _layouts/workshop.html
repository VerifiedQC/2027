---
layout: base
---

<header class="vqc-hero{% if page.hero-compact %} vqc-hero--compact{% endif %}">
  <div class="container-md">
    <div class="row">
      <div class="col-xl-10 offset-xl-1 col-lg-12">
        <div class="vqc-hero__card">
          <div class="vqc-hero__text">
            <h1>{{ page.hero-title | default: page.title }}</h1>
            {% if page.hero-date or page.hero-place %}
            <div class="vqc-hero__dateline">
              {% if page.hero-date %}<a class="vqc-hero__fact vqc-hero__fact--date" href="{{ page.hero-date-link | default: '#important-dates' }}">{{ page.hero-date }}</a>{% endif %}
              {% if page.hero-place %}<a class="vqc-hero__fact" href="{{ page.hero-place-link | default: 'https://conferences.i-cav.org/2027/venue/' }}">{{ page.hero-place }}</a>{% endif %}
            </div>
            {% endif %}
          </div>
          {% if page.hero-img %}
          <div class="vqc-hero__media" aria-hidden="true">
            <img class="vqc-hero__photo" src="{{ page.hero-img | relative_url }}" alt="" decoding="async" fetchpriority="high">
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</header>

<main class="container-md vqc-main">
  <div class="row">
    <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
      <div class="page-content-card">
        {{ content }}
      </div>
    </div>
  </div>
</main>
